<aside class="app-sidebar" aria-label="Menú principal">
  <a class="app-brand" href="/ui/pages/dashboard/dashboard.html">

  </a>
  <p class="side-section">Módulos</p>
  <nav class="side-nav"><a class="side-link" href="/ui/pages/dashboard/dashboard.html">Dashboard</a><a class="side-link" href="/ui/pages/notas/notas.html">Notas</a><a class="side-link" href="/ui/pages/asistencia/asistencia.html" data-roles="TEACHER,ADMINISTRATOR">Asistencia</a><a class="side-link" href="/ui/pages/catalogos/catalogos.html" data-roles="ADMINISTRATOR">Catálogos</a><a class="side-link" href="/ui/pages/reportes/reportes.html" data-roles="TEACHER,ADMINISTRATOR">Reportes</a><a class="side-link" href="/ui/pages/avisos/avisos.html">Avisos</a><a class="side-link active" href="/ui/pages/asistente/asistente.html">Asistente</a><a class="side-link" href="/ui/pages/cuenta/perfil.html">Perfil</a></nav>
</aside>

    <div class="app-main">
      <header class="app-topbar">
        <button type="button" id="btn-sidebar" class="btn-sidebar" aria-expanded="false" aria-label="Abrir menú">Menú</button>
        <h1 class="topbar-title">Asistente</h1>
        <div class="topbar-actions">
          <a href="/ui/pages/cuenta/perfil.html" id="session-chip" class="siga-chip muted">Sin sesión</a>
          <a class="btn btn-outline-secondary btn-sm" href="/ui/pages/cuenta/perfil.html">Perfil</a>
          <button type="button" id="btn-logout" class="btn btn-outline-secondary btn-sm">Cerrar sesión</button>
        </div>
      </header>
      <nav class="breadcrumb" aria-label="Miga de pan"><a href="/ui/pages/dashboard/dashboard.html">Dashboard</a><span class="sep">/</span><span>Asistente</span></nav>
      <main class="app-content">

        <div class="module-head">
          <h2>Asistente</h2>
          <p>Puede proponer acciones. Solo se ejecutan si la política lo permite (PDP).</p>
        </div>

        <div id="ai-thread" class="siga-thread" aria-live="polite" aria-relevant="additions">
          <p class="empty-state mb-0" id="ai-empty">Escribe una consulta o usa un atajo.</p>
        </div>
        <p id="ai-status" class="small text-secondary mt-2 d-none" role="status"></p>

        <div class="composer" role="group" aria-label="Enviar mensaje">
          <label class="visually-hidden" for="ai-message">Mensaje al asistente</label>
          <input id="ai-message" class="form-control" placeholder="Escribe tu consulta" maxlength="4000" autocomplete="off" />
          <button type="button" class="btn btn-siga" id="btn-ai-send">Enviar</button>
        </div>
        <div class="d-flex flex-wrap gap-2 mt-2" role="group" aria-label="Atajos">
          <button type="button" class="btn btn-sm btn-outline-secondary ai-hint">Cuáles son mis calificaciones?</button>
          <button type="button" class="btn btn-sm btn-outline-danger ai-hint">Cambia la nota del estudiante 2 a 100</button>
        </div>

      </main>
    </div>
