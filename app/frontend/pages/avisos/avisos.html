<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Avisos · SIGA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="/ui/assets/css/base.css" />
  <link rel="stylesheet" href="/ui/assets/css/layout.css" />
  <link rel="stylesheet" href="/ui/assets/css/components.css" />
  <link rel="stylesheet" href="/ui/assets/css/forms.css" />
  <link rel="stylesheet" href="/ui/assets/css/tables.css" />
  <link rel="stylesheet" href="/ui/assets/css/admin.css" />

  <link rel="stylesheet" href="/ui/assets/css/responsive.css" />

</head>
<body>
  <div id="toast" class="siga-toast" role="status" aria-live="polite"></div>
  <div class="app-frame">

<aside class="app-sidebar" aria-label="Menú principal">
  <a class="app-brand" href="/ui/pages/dashboard/dashboard.html">
    <span class="app-brand-dot"></span><span>SIGA</span>
  </a>
  <p class="side-section">Módulos</p>
  <nav class="side-nav"><a class="side-link" href="/ui/pages/dashboard/dashboard.html">Dashboard</a><a class="side-link" href="/ui/pages/notas/notas.html">Notas</a><a class="side-link" href="/ui/pages/asistencia/asistencia.html" data-roles="TEACHER,ADMINISTRATOR">Asistencia</a><a class="side-link" href="/ui/pages/catalogos/catalogos.html" data-roles="ADMINISTRATOR">Catálogos</a><a class="side-link" href="/ui/pages/reportes/reportes.html" data-roles="TEACHER,ADMINISTRATOR">Reportes</a><a class="side-link active" href="/ui/pages/avisos/avisos.html">Avisos</a><a class="side-link" href="/ui/pages/asistente/asistente.html">Asistente</a><a class="side-link" href="/ui/pages/cuenta/perfil.html">Perfil</a></nav>
</aside>

    <div class="app-main">
      <header class="app-topbar">
        <button type="button" id="btn-sidebar" class="btn-sidebar" aria-expanded="false" aria-label="Abrir menú">Menú</button>
        <h1 class="topbar-title">Avisos</h1>
        <div class="topbar-actions">
          <a href="/ui/pages/cuenta/perfil.html" id="session-chip" class="siga-chip muted">Sin sesión</a>
          <a class="btn btn-outline-secondary btn-sm" href="/ui/pages/cuenta/perfil.html">Perfil</a>
          <button type="button" id="btn-logout" class="btn btn-outline-secondary btn-sm">Cerrar sesión</button>
        </div>
      </header>
      <nav class="breadcrumb" aria-label="Miga de pan"><a href="/ui/pages/dashboard/dashboard.html">Dashboard</a><span class="sep">/</span><span>Avisos</span></nav>
      <main class="app-content">

        <div class="module-head">
          <h2>Avisos</h2>
          <p>Bandeja del usuario autenticado. El servidor autoriza cada acción.</p>
        </div>
        <div class="admin-toolbar">
          <button type="button" class="btn btn-siga d-none" id="btn-new-record" data-roles="ADMINISTRATOR">+ Nuevo</button>
          <input id="admin-search" class="form-control admin-search" type="search" placeholder="Buscar..." />
          <div class="form-check mb-0">
            <input class="form-check-input" type="checkbox" id="filt-unread" />
            <label class="form-check-label" for="filt-unread">Solo no leídos</label>
          </div>
          <button type="button" class="btn btn-outline-secondary" id="btn-refresh-notif">Actualizar</button>
        </div>

        <section id="admin-create-notif" class="card-soft mb-3 d-none" data-roles="ADMINISTRATOR" aria-label="Crear aviso">
          <p class="eyebrow mb-2">Administración</p>
          <form id="notif-create-form" class="row g-2 align-items-end">
            <div class="col-md-3">
              <label class="form-label req" for="ntf-user">Destinatario</label>
              <select id="ntf-user" class="form-select form-select-sm" required></select>
            </div>
            <div class="col-md-2">
              <label class="form-label" for="ntf-type">Tipo</label>
              <select id="ntf-type" class="form-select form-select-sm">
                <option value="INFO">INFO</option>
                <option value="WARNING">WARNING</option>
                <option value="SUCCESS">SUCCESS</option>
                <option value="ALERT">ALERT</option>
                <option value="SECURITY">SECURITY</option>
                <option value="ACADEMIC">ACADEMIC</option>
              </select>
            </div>
            <div class="col-md-3">
              <label class="form-label req" for="ntf-title">Título</label>
              <input id="ntf-title" class="form-control form-control-sm" maxlength="200" required />
            </div>
            <div class="col-md-4">
              <label class="form-label" for="ntf-body">Cuerpo</label>
              <input id="ntf-body" class="form-control form-control-sm" maxlength="500" />
            </div>
          </form>
        </section>

        <section class="table-wrap" id="notif-list">
          <p class="empty-state mb-0" id="notif-empty" data-empty>Cargando…</p>
          <table class="table table-sm table-hover align-middle data-table">
            <thead>
              <tr>
                <th scope="col" data-sort="id">Id</th>
                <th scope="col" data-sort="title">Título</th>
                <th scope="col" data-sort="type">Tipo</th>
                <th scope="col" data-sort="status">Estado</th>
                <th scope="col">Acciones</th>
              </tr>
            </thead>
            <tbody id="notif-tbody"></tbody>
          </table>
          <div class="admin-pager" id="admin-pager"></div>
          <template id="notif-item-tpl">
            <article class="notif-item d-none">
              <div class="d-flex justify-content-between gap-2">
                <strong data-field="title"></strong>
                <span class="small text-secondary" data-field="type"></span>
              </div>
              <div class="small mt-1" data-field="body"></div>
              <button type="button" class="btn btn-sm btn-outline-secondary mt-2 d-none" data-action="read">Marcar leída</button>
            </article>
          </template>
        </section>

      </main>
    </div>
  </div>

  <script src="/ui/assets/js/core/api.js"></script>
  <script src="/ui/assets/js/components/toast.js"></script>
  <script src="/ui/assets/js/components/table.js"></script>
  <script src="/ui/assets/js/components/modal.js"></script>
  <script src="/ui/assets/js/components/admin-table.js"></script>

  <script src="/ui/assets/js/core/navigation.js"></script>
  <script src="/ui/assets/js/core/auth.js"></script>

  <script src="/ui/assets/js/modules/avisos/avisos.js"></script>
</body>
</html>
