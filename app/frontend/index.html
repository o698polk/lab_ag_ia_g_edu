<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>SIGA</title>
  <script>
    (function () {
      var dest = "/ui/pages/home.html";
      try {
        var raw = localStorage.getItem("siga.lab.session");
        var data = raw ? JSON.parse(raw) : null;
        if (data && (data.accessToken || data.refreshToken)) {
          dest = "/ui/pages/dashboard/dashboard.html";
        }
      } catch (e) {}
      location.replace(dest);
    })();
  </script>
</head>
<body><p><a href="/ui/pages/home.html">Ir a SIGA</a></p></body>
</html>
