# Ref: K-004 | F5
# Alembic will be initialized fully in F6 (K-014). Placeholder keeps path reserved.
[alembic]
script_location = app/backend/alembic
prepend_sys_path = app/backend
sqlalchemy.url = driver://user:pass@127.0.0.1/siga

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
